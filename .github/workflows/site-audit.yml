name: Report-only site audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

jobs:
  audit:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      GA4_PROPERTY_ID: '559060240'
      GA_MEASUREMENT_ID: G-PWV5LBJEQ7
      GA4_HOST_NAME: health-check-platform-v2.netlify.app
      GSC_SITE_URL: https://health-check-platform-v2.netlify.app/
      GA4_CUTOVER_AT: '2026-10-16T02:01:16.899Z'
    defaults:
      run:
        working-directory: lower-back-assessment
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint and test
        run: |
          npm run lint
          npm run sanity:test
          npm run medical-topics:test
          npm run analytics:weekly:test
          npm run search-growth:test

      - name: Build current public content
        id: build
        continue-on-error: true
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID || '69w0i1ba' }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET || 'production' }}
          SANITY_API_VERSION: ${{ secrets.SANITY_API_VERSION || '2026-07-15' }}
          SANITY_READ_TOKEN: ${{ secrets.SANITY_READ_TOKEN }}
        # Static, read-only audit build; no Functions packaging or Netlify deploy.
        # Netlify deploy/branch previews continue to use netlify-safe-build.js.
        run: node scripts/netlify-build.js

      - name: Verify built GA4 tags and migration guards
        if: always() && steps.build.outcome == 'success'
        id: migration
        continue-on-error: true
        run: node scripts/analytics-migration.test.mjs

      - name: Check Sanity audit coverage
        if: always()
        id: coverage
        continue-on-error: true
        run: |
          node scripts/sanity-audit-coverage.js
          node -e 'const r=require("./reports/sanity-audit-coverage.json"); if(!r.complete || !(r.article_count>0)) { console.error("Public article audit requires non-empty, complete coverage."); process.exit(1); }'

      - name: Validate content
        if: always() && steps.build.outcome == 'success'
        id: content
        continue-on-error: true
        run: npm run content:validate

      - name: Validate SEO
        if: always() && steps.build.outcome == 'success'
        id: seo
        continue-on-error: true
        run: npm run seo:validate

      - name: Check links
        if: always() && steps.build.outcome == 'success'
        id: links
        continue-on-error: true
        run: npm run links:check

      - name: Generate site audit
        if: always() && steps.build.outcome == 'success'
        id: site
        continue-on-error: true
        run: npm run audit:site -- --strict

      - name: Audit actual public articles using existing checker
        if: always()
        id: production_articles
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            node --dns-result-order=ipv4first scripts/health-library-index-audit.js --production && exit 0
          done
          exit 1

      - name: Generate search growth report without publishing
        if: always()
        id: growth
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: node scripts/search-growth-report.js

      - name: Upload report without publishing changes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-check-site-audit
          path: |
            lower-back-assessment/reports/site-audit-report.md
            lower-back-assessment/reports/sanity-audit-coverage.json
            lower-back-assessment/reports/search-growth-report.json
            lower-back-assessment/dist/health-indexability-report.json
          if-no-files-found: error

      - name: Fail incomplete or failed audits
        if: always()
        env:
          BUILD: ${{ steps.build.outcome }}
          MIGRATION: ${{ steps.migration.outcome }}
          COVERAGE: ${{ steps.coverage.outcome }}
          CONTENT: ${{ steps.content.outcome }}
          SEO: ${{ steps.seo.outcome }}
          LINKS: ${{ steps.links.outcome }}
          SITE: ${{ steps.site.outcome }}
          PRODUCTION_ARTICLES: ${{ steps.production_articles.outcome }}
          GROWTH: ${{ steps.growth.outcome }}
        run: node -e 'const keys=["BUILD","MIGRATION","COVERAGE","CONTENT","SEO","LINKS","SITE","PRODUCTION_ARTICLES","GROWTH"]; for(const k of keys) console.log(k+"="+process.env[k]); if(keys.some(k=>process.env[k]!=="success")) process.exit(1)'
