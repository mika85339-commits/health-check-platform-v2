name: Report-only site audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lower-back-assessment
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint and test
        run: |
          npm run lint
          npm run sanity:test
          npm run medical-topics:test
          npm run analytics:weekly:test
          npm run search-growth:test
          node scripts/analytics-migration.test.mjs

      - name: Build current public content
        id: build
        continue-on-error: true
        env:
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_API_VERSION: ${{ secrets.SANITY_API_VERSION }}
          SANITY_READ_TOKEN: ${{ secrets.SANITY_READ_TOKEN }}
        run: npm run build

      - name: Check Sanity audit coverage
        if: always()
        id: coverage
        continue-on-error: true
        run: node scripts/sanity-audit-coverage.js

      - name: Validate content
        if: always() && steps.build.outcome == 'success'
        id: content
        continue-on-error: true
        run: npm run content:validate

      - name: Validate SEO
        if: always() && steps.build.outcome == 'success'
        id: seo
        continue-on-error: true
        run: npm run seo:validate

      - name: Check links
        if: always() && steps.build.outcome == 'success'
        id: links
        continue-on-error: true
        run: npm run links:check

      - name: Generate site audit
        if: always() && steps.build.outcome == 'success'
        id: site
        continue-on-error: true
        run: npm run audit:site

      - name: Audit actual public articles using existing checker
        if: always()
        id: production_articles
        continue-on-error: true
        run: npm run seo:audit:articles:production

      - name: Generate search growth report without publishing
        if: always()
        id: growth
        continue-on-error: true
        env:
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          GA4_CUTOVER_AT: ${{ vars.GA4_CUTOVER_AT }}
          GA4_HOST_NAME: ${{ vars.GA4_HOST_NAME }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: node scripts/search-growth-report.js

      - name: Upload report without publishing changes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-check-site-audit
          path: |
            lower-back-assessment/reports/site-audit-report.md
            lower-back-assessment/reports/sanity-audit-coverage.json
            lower-back-assessment/reports/search-growth-report.json
            lower-back-assessment/dist/health-indexability-report.json
          if-no-files-found: error

      - name: Fail incomplete or failed audits
        if: always()
        env:
          BUILD: ${{ steps.build.outcome }}
          COVERAGE: ${{ steps.coverage.outcome }}
          CONTENT: ${{ steps.content.outcome }}
          SEO: ${{ steps.seo.outcome }}
          LINKS: ${{ steps.links.outcome }}
          SITE: ${{ steps.site.outcome }}
          PRODUCTION_ARTICLES: ${{ steps.production_articles.outcome }}
          GROWTH: ${{ steps.growth.outcome }}
        run: node -e 'const keys=["BUILD","COVERAGE","CONTENT","SEO","LINKS","SITE","PRODUCTION_ARTICLES","GROWTH"]; for(const k of keys) console.log(k+"="+process.env[k]); if(keys.some(k=>process.env[k]!=="success")) process.exit(1)'
