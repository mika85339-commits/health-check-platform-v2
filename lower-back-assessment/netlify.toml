[build]
  command = "node scripts/netlify-build.js"
  publish = "dist"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "GA4_HOST_NAME,GA4_PROPERTY_ID,GSC_SITE_URL"

[functions]
  directory = "netlify/functions"
  included_files = [
    "admin/weekly-analytics/index.html",
    "scripts/weekly-analytics.js",
    "scripts/weekly-analytics-events.js",
    "scripts/weekly-analytics-sources.js"
  ]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"
